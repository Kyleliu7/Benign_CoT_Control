### model
model_name_or_path: openai/gpt-oss-20b
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora

# 1. Standard Linear Attention Projections + MoE Expert Projections
# Note: Upstream LLaMA-Factory / PEFT targets MoE expert feed-forward layers via lora_target module names
# (e.g., q_proj,k_proj,v_proj,o_proj,gate_up_proj,down_proj or regex r".*experts\..*(gate_up_proj|down_proj)").
# target_parameters was used in custom parameter-wrapper forks. For standard stock LLaMA-Factory, include
# expert linear projections directly in lora_target.
lora_target: q_proj,k_proj,v_proj,o_proj,gate_up_proj,down_proj

# LoRA Hyperparameters (Rank 16 required for 96GB VRAM feasibility; Dropout 0.0 required by PEFT ParamWrapper)
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.0

### dataset
# Point to registered dataset in data/training/dataset_info.json
dataset: gpt52_high_reasoning_original
dataset_dir: data/training
template: gpt_oss
cutoff_len: 1792
train_on_prompt: false
packing: false
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: ./outputs/gptoss-20b-gpt-52-expert-lora
logging_steps: 5
save_strategy: steps
save_steps: 10
eval_strategy: steps
eval_steps: 10
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
plot_loss: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.0
bf16: true
gradient_checkpointing: true
flash_attn: auto
seed: 42

### eval
val_size: 0.1
per_device_eval_batch_size: 1
