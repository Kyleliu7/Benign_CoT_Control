### Model
model_name_or_path: Qwen/Qwen3-14B
trust_remote_code: true

### Method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05

### Dataset
dataset: gpt52_high_reasoning_original
dataset_dir: data
template: qwen
cutoff_len: 4096
train_on_prompt: false
packing: false
overwrite_cache: true
preprocessing_num_workers: 8

### Output
output_dir: ./saves/qwen3-14b-gpt52-short-lora
logging_steps: 5
save_strategy: steps
save_steps: 20
eval_strategy: steps
eval_steps: 20
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
plot_loss: true
report_to: none

### Hyperparameters
num_train_epochs: 3.0
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
